name: Android APK

# Builds an installable release APK (signed with the debug key) and attaches it to the run.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/beautiful-dirac-4cpz8i]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      # Publishable values: they end up in every APK anyway. Repo variables override them.
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://tbthvchteugysbznnhez.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_xO2FasWi-uKWpFdA8yXqSw_gbtM7H73' }}
      EXPO_PUBLIC_MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kaucjomat-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # Stable public download link: https://github.com/<repo>/releases/download/apk-latest/kaucjomat.apk
      - name: Publish APK to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk kaucjomat.apk
          gh release view apk-latest > /dev/null 2>&1 || \
            gh release create apk-latest --prerelease --title "Kaucjomat APK (najnowszy build)" --notes "APK budowany automatycznie."
          gh release upload apk-latest kaucjomat.apk --clobber
          gh release edit apk-latest --notes "Najnowszy build: ${{ github.sha }} (${{ github.ref_name }}). Pobierz kaucjomat.apk na telefonie i otwórz plik."

  # Smoke test on an emulator: screenshots of the map so rendering can be checked without a phone.
  map-screenshot:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kaucjomat-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: .github/scripts/map-screenshot.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-screenshots
          path: screenshots
          retention-days: 14

      - name: Print app log
        if: always()
        run: tail -200 screenshots/logcat-app.txt || true

      # Artifacts are not reachable from every environment, so the latest screenshots are also
      # committed (as normal commits, never force-pushed) to the ci-screenshots branch.
      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/git/refs" -f ref=refs/heads/ci-screenshots -f sha="${{ github.sha }}" > /dev/null 2>&1 || true
          for f in map-light.png map-dark.png logcat-app.txt; do
            [ -f "screenshots/$f" ] || continue
            sha=$(gh api "repos/$REPO/contents/ci/$f?ref=ci-screenshots" --jq .sha 2>/dev/null || true)
            base64 -w0 "screenshots/$f" > /tmp/content.b64
            args=(-X PUT "repos/$REPO/contents/ci/$f" -f message="Map screenshot $f for ${{ github.sha }}" -f branch=ci-screenshots -F content=@/tmp/content.b64)
            [ -n "$sha" ] && args+=(-f sha="$sha")
            gh api "${args[@]}" > /dev/null
          done

